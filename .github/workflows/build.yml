name: Build check

# Compiles a signed release build on every push and on manual runs, purely to catch a broken build
# or an R8/ProGuard problem early. It intentionally does NOT upload any APK artifact and does NOT
# create a release, so nothing downloadable is exposed -- the repo is public, and public-repo
# artifacts are downloadable by anyone. Get actual APKs from the "Release" workflow (public, meant
# for distribution) or by building locally.
#
# Only the repository owner can trigger this: pushes come from you, manual runs require write
# access, and GitHub never exposes secrets to pull requests from forks.

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Set a default so the runner's git doesn't print the "using 'master'…" hint during checkout.
      - name: Quiet git default-branch hint
        run: git config --global init.defaultBranch main

      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Write local.properties and keystore from secrets
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
          PLACES_API_KEY: ${{ secrets.PLACES_API_KEY }}
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/keystore.p12"
          {
            echo "sdk.dir=$ANDROID_SDK_ROOT"
            echo "MAPS_API_KEY=$MAPS_API_KEY"
            echo "ORS_API_KEY=$ORS_API_KEY"
            echo "PLACES_API_KEY=$PLACES_API_KEY"
            echo "storeFile=$GITHUB_WORKSPACE/keystore.p12"
            echo "storePassword=$SIGNING_STORE_PASSWORD"
            echo "keyAlias=$SIGNING_KEY_ALIAS"
            echo "keyPassword=$SIGNING_KEY_PASSWORD"
          } > local.properties

      - name: Build check (compile only, nothing uploaded)
        env:
          VERSION_NAME: 2.0.0-ci.${{ github.run_number }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          export VERSION_CODE=$((20000 + VERSION_CODE))
          ./gradlew :app:assembleFullRelease --no-daemon

      - name: Clean up secrets
        if: always()
        run: rm -f local.properties keystore.p12
