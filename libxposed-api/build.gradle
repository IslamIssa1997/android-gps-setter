// libxposed API, vendored from https://github.com/libxposed/api (tag 102.0.0).
// Consumed with `compileOnly` by :app -- the Xposed framework provides these classes
// at runtime, so nothing here must ever be packaged into the APK.
plugins {
    id 'com.android.library'
}

android {
    namespace = 'io.github.libxposed.api'
    compileSdk 36

    defaultConfig {
        minSdk 26
    }

    buildFeatures {
        buildConfig = false
        androidResources = false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError = false
    }
}

dependencies {
    compileOnly 'androidx.annotation:annotation:1.9.1'
    compileOnly 'io.github.libxposed:annotation:1.0.0'
}
